name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This only needs to be able to run Gradle itself - the build's own toolchain (Java 25,
      # see build.gradle.kts) is auto-provisioned by Gradle's foojay resolver (settings.gradle.kts)
      # regardless of what version is set up here.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          retention-days: 14

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: easybans-jar
          path: build/libs/*.jar
          retention-days: 14
